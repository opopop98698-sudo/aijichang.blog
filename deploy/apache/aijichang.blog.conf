# ==============================================================================
# aijichang.blog - Apache 2.4+ 生产环境 VirtualHost 虚拟主机标准配置示例
# 包含 HTTP 强制 301 跳转 HTTPS、静态根目录绑定、日志轮转与安全防护
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP 80 端口服务：全量 301 永久重定向至 HTTPS
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName aijichang.blog
    ServerAlias www.aijichang.blog
    ServerAdmin webmaster@aijichang.blog

    # 强制将所有 HTTP 请求永久重定向至标准 HTTPS 规范主域
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://aijichang.blog$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/aijichang_blog_error.log
    CustomLog ${APACHE_LOG_DIR}/aijichang_blog_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. HTTPS 443 端口服务：SSL 终结与纯静态产物托管
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName aijichang.blog
    ServerAlias www.aijichang.blog
    ServerAdmin webmaster@aijichang.blog

    # 网站物理根目录（指向 VitePress 编译构建产物目录 dist）
    DocumentRoot /var/www/aijichang.blog/site/.vitepress/dist

    # 目录访问权限与 .htaccess 覆盖授权
    <Directory "/var/www/aijichang.blog/site/.vitepress/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 规范化：将 www.aijichang.blog 301 重定向至裸域 aijichang.blog
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.aijichang\.blog$ [NC]
    RewriteRule ^(.*)$ https://aijichang.blog$1 [R=301,L]

    # SSL 证书配置 (推荐 Let's Encrypt / Certbot 自动化证书)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/aijichang.blog/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aijichang.blog/privkey.pem

    # 现代 TLS 协议安全套件加固
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # HSTS 严格安全传输头 (开启 6 个月预加载)
    Header always set Strict-Transport-Security "max-age=15768000; includeSubDomains; preload"

    # 访问与错误日志 (启用标准组合格式)
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/aijichang_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/aijichang_ssl_access.log combined
</VirtualHost>
